name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Postgres 16 + migrate + npm test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d erp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp_ci
      NODE_ENV: test
      ERP_AUTH_SOFT: "1"
      TCMB_SCHEDULER: "off"
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: Migration — temiz DB (001…N)
        run: npm run migrate

      - name: Migration — ikinci koşu idempotent
        run: npm run migrate

      - name: Test fixture (owner/admin, cari, stok)
        run: node scripts/ci/seed-test-db.js

      - name: Testler (bilinen hata listesine göre)
        run: node scripts/ci/run-tests.js

      - name: Uygulama açılışı + /health + /ready
        run: |
          mkdir -p test-results
          PORT=3333 HOST=127.0.0.1 LOG_FORMAT=json node index.js > test-results/app.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3333/ready > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3333/health
          curl -fsS http://127.0.0.1:3333/ready | tee test-results/ready.json
          kill -TERM "$APP_PID"
          wait "$APP_PID" || true
          grep -q '"msg":"kapanış tamam"' test-results/app.log

      - name: Yedek + geri yükleme tatbikatı (şifreli, CI DB)
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ci-only-not-a-secret-passphrase
          BACKUP_DIR: ${{ runner.temp }}/backups
        run: |
          pg_dump --version
          node scripts/db-backup.js --no-offsite
          node scripts/db-restore-drill.js --with-migrate

      - name: npm audit (production bağımlılıkları)
        run: npm audit --omit=dev --audit-level=high

      - name: Test çıktıları
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            ${{ runner.temp }}/backups/drill-reports/
          if-no-files-found: ignore
          retention-days: 14

  docker:
    name: Docker build + compose smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: ci-compose-password
      JWT_SECRET: ci-compose-jwt-secret-not-for-production-0123456789
      APP_PORT: "3000"
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ktb-erp:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: compose up (postgres → migrate → app)
        run: docker compose up -d --no-build --wait --wait-timeout 180

      - name: /ready
        run: |
          curl -fsS http://127.0.0.1:3000/health
          curl -fsS http://127.0.0.1:3000/ready

      - name: Yedek + tatbikat (compose ops profili)
        run: |
          docker compose run --rm backup
          docker compose run --rm restore-drill

      - name: Loglar
        if: always()
        run: docker compose logs --no-color > compose.log; tail -n 200 compose.log

      - name: compose down
        if: always()
        run: docker compose down -v
