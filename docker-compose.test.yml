# İzole test veritabanı (tmpfs — her yeniden başlatmada boş). Prod secret'ı gerektirmez.
#
#   docker compose -f docker-compose.test.yml up -d --wait
#   npm run test:isolated            # veya: npm run test:isolated -- --docker --fresh
#   docker compose -f docker-compose.test.yml down

name: ktb-erp-test

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: erp_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erp_test"]
      interval: 2s
      timeout: 3s
      retries: 30
