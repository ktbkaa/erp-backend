<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KTB ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand" id="btnHome" title="Ana sayfa">
        <span class="brand-mark">KTB</span>
        <span class="brand-name">KTB ERP</span>
      </div>
      <nav class="sidebar-nav" id="sidebarNav" aria-label="Modül menüsü"></nav>
      <div class="sidebar-foot">
        <a href="/health" target="_blank" class="health-link">Sistem durumu</a>
      </div>
    </aside>

    <div class="workspace">
      <header class="workspace-bar" id="workspaceBar">
        <div class="bar-left">
          <button type="button" class="icon-btn" id="btnMenu" aria-label="Menüyü aç/kapat">☰</button>
          <h1 class="screen-title" id="screenTitle">Ana Sayfa</h1>
        </div>
        <div class="bar-right" id="homeSearchWrap">
          <label class="search-label" for="screenSearch">Ekran ara</label>
          <input
            id="screenSearch"
            class="screen-search"
            type="search"
            placeholder="Ekran adı yazın (en az 3 harf)…"
            autocomplete="off"
          />
          <div id="searchResults" class="search-results" hidden></div>
        </div>
      </header>

      <main class="workspace-main">
        <section id="viewHome" class="view home-view">
          <p class="home-lead">Soldaki menüden modül ekranına gidin veya üstten ekran adı arayın.</p>
          <div id="homeHints" class="home-hints"></div>
        </section>

        <section id="viewScreen" class="view screen-view" hidden>
          <div class="filter-pane" id="filterPane">
            <div class="filter-pane-head">
              <h2>Filtre</h2>
              <div class="filter-actions">
                <button type="button" class="btn ghost" id="btnClearFilter">Temizle</button>
                <button type="button" class="btn" id="btnApplyFilter">Uygula</button>
              </div>
            </div>
            <div class="filter-grid" id="filterGrid"></div>
          </div>
          <div class="list-pane" id="listPane">
            <div class="list-pane-head">
              <h2>Liste</h2>
              <span class="list-meta" id="listMeta"></span>
            </div>
            <div class="table-scroll">
              <table id="dataTable">
                <thead id="dataHead"></thead>
                <tbody id="dataBody"></tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
