# Render Blueprint — YALNIZ DEMO / DENEME (ücretsiz web + harici ücretsiz Neon Postgres)
# CANLI (production) İÇİN KULLANMAYIN: free plan uykuya geçer (soğuk başlatma), yedek/PITR yok,
# preDeployCommand desteklenmez. Canlı için kökteki render.yaml'ı kullanın.
#
# Kullanım: Render → New Blueprint Instance → "Blueprint file path" = render.demo.yaml
# Önkoşul: Neon’da ücretsiz DB oluşturup DATABASE_URL’i Render env’e yapıştırın (https://console.neon.tech).

services:
  - type: web
    name: ktb-erp-demo
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: node db/migrate.js && node index.js
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "3000"
      - key: LOG_FORMAT
        value: json
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
